# `unrs-resolver` is the native resolver behind eslint-plugin-import-x, which
# eslint-config-expo depends on. Its postinstall step must run or linting fails.
allowBuilds:
  unrs-resolver: true

# pnpm 11 gates very recently published versions. These are the Expo SDK 57
# packages the Expo CLI pins for us, so they are allowed through explicitly.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.13'
  - '@expo/config-plugins@57.0.7'
  - babel-preset-expo@57.0.6
  - expo-asset@57.0.9
  - expo-file-system@57.0.2
  - expo-modules-core@57.0.10
  - expo@57.0.11
  - expo-location@57.0.8
  - expo-notifications@57.0.9
  - expo-router@57.0.11
  - expo-symbols@57.0.2
